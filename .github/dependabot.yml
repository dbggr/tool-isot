# Auto-generated 2026-05-17 per STANDARDS.md §4 — weekly + grouped + limit 5
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    # TS7 ships no JS API, so `typescript` is aliased to @typescript/typescript6 (API for
    # typescript-eslint, ts-jest, ts-node, next) and `@typescript/native` is TS7 (`tsc` CLI).
    # Keep `typescript` pinned to the 6.x alias until TS 7.1 ships an API the tools adopt.
    # ESLint 10 runs with the react/jsx-a11y/import plugins via the `eslint` override (2026-10-10).
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
